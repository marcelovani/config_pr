services:
  config_pr_gitlab.repo_controller.gitlab:
    class: Drupal\config_pr_gitlab\RepoControllers\GitLabController
    arguments: ['@messenger']
    tags:
      - { name: config_pr.repo_controller }

  config_pr_gitlab.repo_controller.gitlab_self_managed:
    class: Drupal\config_pr_gitlab\RepoControllers\GitlabSelfManagedController
    arguments: ['@messenger']
    tags:
      - { name: config_pr.repo_controller }
