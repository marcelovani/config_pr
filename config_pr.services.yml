services:
  config_pr.repo_controller_manager:
    class: Drupal\config_pr\RepoControllerManager
    arguments: ['@messenger']
    tags:
      - { name: service_collector, tag: config_pr.repo_controller, call: addController }

  config_pr.dummy_repo_controller:
    class: Drupal\config_pr\RepoControllers\DummyController
    tags:
      - { name: config_pr.repo_controller }

  config_pr.repo_controller_factory:
    class: Drupal\config_pr\RepoControllerFactory
    arguments: ['@config.factory', '@service_container']

  config_pr.active_repo_controller:
    class: Drupal\config_pr\RepoControllerInterface
    factory: ['@config_pr.repo_controller_factory', 'getController']
